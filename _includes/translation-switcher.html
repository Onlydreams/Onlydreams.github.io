{%- assign page_translations = site.data.translations[page.translation_key] -%}
{%- if page_translations -%}
  <nav class="translation-switcher" aria-label="{% if page.lang == "en" %}Article language{% else %}文章语言{% endif %}">
    {%- if page.lang == "en" -%}
      <span>English</span>
      <a href="{{ page_translations.zh | relative_url }}" lang="zh-CN">阅读中文版</a>
    {%- else -%}
      <span>中文</span>
      <a href="{{ page_translations.en | relative_url }}" lang="en">Read in English</a>
    {%- endif -%}
  </nav>
{%- endif -%}
